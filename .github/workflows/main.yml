name: auto-import program

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Cache program_import compiles
      id: cache-binary
      env:
        cache-name: cache-binary
      uses: actions/cache@v4
      with:
        path: program_import/target/debug/program_import
        key: ${{ runner.os }}-build-${{ env.cache-name }}-${{ hashFiles('program_import/**/*', '!program_import/target') }}
    - if: ${{ steps.cache-binary.outputs.cache-hit != 'true' }}
      name: Build
      working-directory: ./program_import
      run: cargo run --locked
    - if: ${{ steps.cache-binary.outputs.cache-hit == 'true' }}
      name: Run already built binary
      working-directory: ./program_import
      run: ./target/debug/program_import
    - run: git add content
    - name: setup git config
      run: |
        git config user.name "GitHub Actions Bot"
        git config user.email "<>"
    - run: git commit -m "Automatic program import" || true
    - run: git push
